name: axion-v2

# Day-0 local infrastructure: Neo4j only.
# The password is supplied by the local, gitignored .env and is never committed.
# Ports are bound to loopback only. Redis/worker/API are intentionally absent.

services:
  neo4j:
    image: neo4j:5.18-community
    restart: unless-stopped
    environment:
      # Only NEO4J_AUTH is passed for auth. Neo4j maps every NEO4J_* variable
      # to a server setting, so passing NEO4J_PASSWORD too fails strict
      # validation with "No declared setting with name: PASSWORD".
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      # Cap memory for an owner laptop (Neo4j 5.x naming scheme: dots -> _,
      # literal underscores -> __). Verified against the Neo4j 5 operations
      # manual: https://neo4j.com/docs/operations-manual/5/docker/configuration/
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
    ports:
      # Host ports 7475/7888 avoid V1's 7474/7887, so both stacks can coexist.
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7888:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
