# Verified provider list prices (USD per 1,000,000 tokens).
#
# Source (checked 2026-11-15):
#   https://console.groq.com/docs/model/openai/gpt-oss-120b
#   https://console.groq.com/docs/model/openai/gpt-oss-20b
# The pages show input / cached input / output prices. Prices are list prices;
# the ledger records list-price cost even when a free tier is used.

version: 1
currency: USD
models:
  "openai/gpt-oss-120b":
    provider: "groq"
    input_usd_per_mtok: "0.15"
    output_usd_per_mtok: "0.60"
    cached_input_usd_per_mtok: "0.075"
  "openai/gpt-oss-20b":
    provider: "groq"
    input_usd_per_mtok: "0.075"
    output_usd_per_mtok: "0.30"
    cached_input_usd_per_mtok: "0.037"
