# Verified provider list prices (USD per 1,000,000 tokens).
#
# Groq (checked 2026-11-15):
#   https://console.groq.com/docs/model/openai/gpt-oss-120b
#   https://console.groq.com/docs/model/openai/gpt-oss-20b
#
# Google Gemini (checked 2026-11-15):
#   https://ai.google.dev/gemini-api/docs/pricing
#   https://ai.google.dev/gemini-api/docs/models
# Both models below are available and have a free tier ("Free of charge").
# Gemini 3.8 Flash introductory pricing applies through 2026-12-31; the higher
# price starts 2027-01-01. The free tier has no charge, but the ledger records
# the list-price cost and marks billing=free_tier so reports can show both.
# Prices are list prices; no paid billing is enabled for the P1 baseline.

version: 2
currency: USD
